{% extends "base.html" %} {% block title %}Dashboard · Flask Auth Lite{% endblock %}
{% block content %}
<h1 class="text-3xl font-semibold mb-2">Dashboard</h1>
<p class="text-slate-400 mb-6">
  You're logged in as
  <span class="text-slate-200 font-medium">{{ user.email if user else session.get('email', 'unknown') }}</span>.
</p>

<div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
  <h2 class="font-semibold mb-2">Account</h2>
  <p class="text-sm text-slate-400">
    This is a protected page — only visible to logged-in users.
  </p>
</div>

<a
  href="/logout"
  class="inline-block mt-6 rounded-xl border border-slate-800 bg-slate-900 px-4 py-2 text-sm hover:bg-slate-800/50"
>
  Logout
</a>
{% endblock %}
