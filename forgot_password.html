{% extends "base.html" %} {% block title %}Forgot password · Flask Auth Lite{% endblock %}
{% block content %}
<section class="mx-auto max-w-md">
  <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
    <h1 class="text-2xl font-semibold">Forgot your password?</h1>
    <p class="mt-1 text-slate-400 text-sm">
      Enter your email and we'll send you a link to reset your password.
    </p>

    <form method="POST" action="/forgot-password" class="mt-6 space-y-4">
      <div>
        <label for="email" class="block text-sm text-slate-400 mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full rounded-xl border border-slate-800 bg-slate-900 px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-600"
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-slate-100 text-slate-900 font-semibold py-2 hover:bg-white transition"
      >
        Send reset link
      </button>
    </form>

    <p class="mt-4 text-sm text-slate-400">
      Remembered your password?
      <a href="/login" class="text-slate-200 underline hover:text-white">Back to login</a>
    </p>
  </div>
</section>
{% endblock %}
