<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Link unavailable — Secure Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#818cf8;
    --purple-tint:#333340;
    --ink:#f3f4f6;
    --muted:#9ca3af;
    --border:#3a3a46;
    --bg:#202025;
    --surface:#282830;
    --surface-soft:#303038;
  }
  html[data-theme="light"]{
    --purple:#5B3FE0;
    --purple-tint:#EFEAFF;
    --ink:#16151F;
    --muted:#6B7280;
    --border:#E7E5F0;
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-soft:#F7F6FC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    transition:background .2s ease, color .2s ease;
  }
  .share-page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 20px 50px;
  }
  .top-bar{
    width:100%;
    max-width:440px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:15.5px;
    font-weight:800;
    color:var(--ink);
    text-decoration:none;
  }
  .brand .logo{
    width:32px; height:32px;
    border-radius:10px;
    background:var(--purple);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
  }
  .theme-btn{
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    background:var(--surface-soft);
    border:1.5px solid var(--border);
    border-radius:999px;
    padding:7px 13px;
    cursor:pointer;
  }
  .share-card{
    width:100%;
    max-width:440px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:24px;
    padding:34px 28px 30px;
    text-align:center;
    box-shadow:0 18px 40px rgba(22,21,31,0.06);
  }
  .file-icon{
    width:62px; height:62px;
    margin:0 auto 18px;
    border-radius:18px;
    background:var(--purple-tint);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
  }
  h1{
    font-size:20px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 10px;
  }
  p{
    font-size:13.5px;
    line-height:1.6;
    color:var(--muted);
    margin:0 0 22px;
  }
  .home-link{
    display:inline-block;
    font-size:13.5px;
    font-weight:600;
    color:var(--purple);
    background:var(--purple-tint);
    border-radius:12px;
    padding:10px 18px;
    text-decoration:none;
  }
  footer{
    margin-top:26px;
    font-size:12px;
    color:var(--muted);
  }
</style>
</head>
<body>
<div class="share-page">
  <div class="top-bar">
    <a class="brand" href="/"><span class="logo">🔒</span><span>Secure Vault</span></a>
    <button type="button" class="theme-btn" id="themeBtn">☀️ Light</button>
  </div>

  <div class="share-card">
    <div class="file-icon">⏳</div>
    <h1>This link is no longer available</h1>
    <p>The link may have expired, or it has already been used the allowed number of times. Ask the sender for a new link.</p>
    <a class="home-link" href="/">Go to Secure Vault</a>
  </div>

  <footer>Shared securely with Secure Vault</footer>
</div>

<script>
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    themeBtn.textContent = t === 'light' ? '🌙 Dark' : '☀️ Light';
    try { localStorage.setItem('vault_theme', t); } catch(e) {}
  }
  (function initTheme(){
    let stored = 'dark';
    try { stored = localStorage.getItem('vault_theme') || 'dark'; } catch(e) {}
    applyTheme(stored);
  })();
  themeBtn.addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });
</script>
</body>
</html>
