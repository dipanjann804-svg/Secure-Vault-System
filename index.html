<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Vault — Encrypted Document Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#6366f1;
    --purple-dark:#4f46e5;
    --purple-tint:#333340;
    --blue-tint:#283240;
    --green-tint:#22352c;
    --yellow-tint:#383424;
    --yellow-border:#564e30;
    --ink:#f3f4f6;
    --muted:#9ca3af;
    --border:#3a3a46;
    --bg:#202025;
    --surface:#282830;
    --surface-soft:#303038;
    --surface-soft-hover:#383842;
  }
  html[data-theme="dark"]{
    --purple:#818cf8;
    --purple-dark:#6366f1;
    --purple-tint:#333340;
    --blue-tint:#283240;
    --green-tint:#22352c;
    --yellow-tint:#383424;
    --yellow-border:#564e30;
    --ink:#f3f4f6;
    --muted:#9ca3af;
    --border:#3a3a46;
    --bg:#202025;
    --surface:#282830;
    --surface-soft:#303038;
    --surface-soft-hover:#383842;
  }
  html[data-theme="light"]{
    --purple:#5B3FE0;
    --purple-dark:#4A31C4;
    --purple-tint:#EFEAFF;
    --blue-tint:#E7F0FF;
    --green-tint:#EAF7EE;
    --yellow-tint:#FFF6DA;
    --yellow-border:#F4E4A6;
    --ink:#16151F;
    --muted:#6B7280;
    --border:#E7E5F0;
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-soft:#F7F6FC;
    --surface-soft-hover:#EFEDF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100vh;
    transition: background .2s ease, color .2s ease;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px;min-height:100vh;display:flex;flex-direction:column;}
  @keyframes pop{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* Top nav — same language as dashboard header */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:44px;
  }
  .brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--ink);
    font-weight:800;
    font-size:16px;
    letter-spacing:-0.01em;
  }
  .brand .logo{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--purple);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .brand span.accent{color:var(--purple);}
  .nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .theme-btn{
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:9px 14px;
    background:var(--surface-soft);color:var(--ink);
    border:1px solid var(--border);border-radius:999px;cursor:pointer;
  }
  .theme-btn:hover{background:var(--surface-soft-hover);}
  .btn-secondary{
    font-family:inherit;font-size:13.5px;font-weight:600;
    padding:11px 20px;
    background:var(--surface-soft);color:var(--ink);
    border:1px solid var(--border);border-radius:999px;cursor:pointer;
    text-decoration:none;display:inline-block;
  }
  .btn-secondary:hover{background:var(--surface-soft-hover);}
  .btn-primary{
    font-family:inherit;font-size:13.5px;font-weight:600;
    padding:11px 22px;
    background:var(--purple);color:#fff;
    border:none;border-radius:999px;cursor:pointer;
    text-decoration:none;display:inline-block;
    transition:background .15s ease;
  }
  .btn-primary:hover{background:var(--purple-dark);}

  /* Hero — vertically centered to fill the screen */
  .hero{
    text-align:center;
    max-width:680px;
    width:100%;
    margin:0 auto;
    padding:40px 0;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    animation:pop .18s ease;
  }
  .count-pill{
    display:inline-block;
    font-size:12.5px;
    color:var(--purple);
    background:var(--purple-tint);
    padding:6px 14px;
    border-radius:999px;
    font-weight:600;
    margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(38px, 6vw, 58px);
    font-weight:800;
    margin:0 0 12px;
    letter-spacing:-0.03em;
    line-height:1.05;
  }
  .hero h1 span{color:var(--purple);}
  .hero p{
    margin:0 0 26px;
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
  }
  .hero-cta{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
  .hero-cta .btn-primary, .hero-cta .btn-secondary{font-size:14px;padding:13px 26px;}

  footer{
    margin-top:44px;
    padding-top:20px;
    border-top:1px solid var(--border);
    text-align:center;
    font-size:12.5px;color:var(--muted);
  }
  @media (max-width:600px){
    .hero h1{font-size:34px;}
    .nav{margin-bottom:30px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <a class="brand" href="/"><span class="logo">🔒</span><span>Secure <span class="accent">Vault</span></span></a>
    <div class="nav-actions">
      <button type="button" class="theme-btn" id="themeBtn">☀️ Light</button>
      <a href="/login" class="btn-secondary">Log in</a>
      <a href="/register" class="btn-primary">Create account</a>
    </div>
  </nav>

  <div class="hero">
    <span class="count-pill">🔐 AES-encrypted · Private by default</span>
    <h1>Your vault for <span>everything important</span></h1>
    <p>Store identity docs, finance files, health records and quick notes — organized in folders, encrypted, and searchable from one clean dashboard.</p>
    <div class="hero-cta">
      <a href="/register" class="btn-primary">Get started →</a>
    </div>
  </div>

  <footer>
    <span>🔒 Secure Vault System</span>
  </footer>

</div>

<script>
  // Theme — synced with dashboard / auth pages via vault_theme
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t){
    if(t === 'light'){
      document.documentElement.setAttribute('data-theme', 'light');
      themeBtn.textContent = '🌙 Dark';
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️ Light';
    }
    localStorage.setItem('vault_theme', t);
  }
  (function initTheme(){
    applyTheme(localStorage.getItem('vault_theme') || 'dark');
  })();
  themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(cur === 'light' ? 'dark' : 'light');
  });
</script>
</body>
</html>
